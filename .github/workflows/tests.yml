# CI exists partly to be read: the review agent gates on these check runs and
# halts rather than reviewing a red branch, so this workflow is what the CI gate
# sees. Keep it fast — a slow suite means the worker re-checks a pending state
# and reviews anyway.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # google-adk does not support 3.14

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r receiver/requirements.txt -r worker/requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest tests/ -q
